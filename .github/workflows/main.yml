name: Python Test

on:
  push:
    branches:
      - main
      - feature/version2
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        
    - name: Run tests
     run: python -m unittest test_hello.py
    
